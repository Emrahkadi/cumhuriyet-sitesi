<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e5aa8">
  <title>Çevrimdışı - Cumhuriyet Sitesi</title>
  <link rel="stylesheet" href="/css/style.css?v=16" />
  <style>
    .offline-wrap { max-width: 480px; margin: 80px auto; padding: 32px 24px; text-align: center; }
    .offline-wrap .icon { font-size: 4rem; margin-bottom: 16px; }
    .offline-wrap h1 { color: var(--renk-ana); margin-bottom: 12px; }
    .offline-wrap p { color: var(--metin-acik); margin-bottom: 24px; line-height: 1.6; }
    .offline-wrap .btn { display: inline-block; padding: 12px 24px; background: var(--renk-ana); color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="offline-wrap">
    <div class="icon">📡</div>
    <h1>Çevrimdışısınız</h1>
    <p>İnternet bağlantınız yok gibi görünüyor. Daha önce gezdiğiniz sayfaları görüntüleyebilirsiniz; yeni içerikler için bağlantınızı kontrol edin.</p>
    <a href="/" class="btn">Ana Sayfayı Dene</a>
  </div>
</body>
</html>
